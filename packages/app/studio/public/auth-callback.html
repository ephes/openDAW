<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authentication - openDAW</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .container {
            background: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 400px;
        }

        .success {
            color: #10b981;
            font-size: 3rem;
            margin-bottom: 1rem;
        }

        .error {
            color: #ef4444;
            font-size: 3rem;
            margin-bottom: 1rem;
        }

        h1 {
            color: #1f2937;
            font-size: 1.5rem;
            margin: 0 0 0.5rem 0;
        }

        p {
            color: #6b7280;
            margin: 0;
        }
    </style>
</head>
<body>
<div class="container" id="container">
    <div class="success">⏳</div>
    <h1>Authenticating...</h1>
    <p>Please wait...</p>
</div>
<script>
    const container = document.getElementById('container');
    const qs = new URLSearchParams(window.location.search);
    const hs = new URLSearchParams(window.location.hash.replace(/^#/, ''));
    const state = qs.get('state') || hs.get('state');
    const service = state && state.split('.')[0];
    const channel = new BroadcastChannel('auth-callback');
    const correlated = message => ({...message, state, service});
    window.onbeforeunload = () => channel.postMessage(correlated({type: 'closed'}));

    function showError(headline, message) {
        const icon = document.createElement('div');
        icon.className = 'error';
        icon.textContent = '⚠️';
        const title = document.createElement('h1');
        title.textContent = headline;
        const detail = document.createElement('p');
        detail.textContent = message;
        container.replaceChildren(icon, title, detail);
    }

    function postAndClose(message) {
        try {
            channel.postMessage(correlated(message));
            channel.close();
            window.onbeforeunload = null;
            window.close();
        } catch (error) {
            showError('Communication Error', String(error));
        }
    }

    if (!state || !['dropbox', 'google'].includes(service)) {
        showError('Unexpected Response', 'Missing authentication state. Please retry from the studio.');
    } else if (qs.has('error') || hs.has('error')) {
        showError('Authentication Failed', qs.get('error_description') || hs.get('error_description') || 'Authentication failed');
        channel.postMessage(correlated({type: 'auth-error'}));
    } else if (service === 'dropbox' && qs.has('code')) {
        postAndClose({type: 'auth-callback', code: qs.get('code')});
    } else if (service === 'google' && hs.has('access_token')) {
        postAndClose({type: 'auth-callback', access_token: hs.get('access_token')});
    } else {
        showError('Unexpected Response', 'No authentication data received.');
    }
</script>
</body>
</html>
